name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install minifier
        run: npm install -g html-minifier-terser csso-cli terser
      
      - name: Minify CSS
        run: |
          find . -name "*.css" -not -path "./node_modules/*" | while read f; do
            csso "$f" --output "${f%.css}.min.css"
          done
      
      - name: Minify JS
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -not -name "*.min.js" | while read f; do
            terser "$f" --compress --mangle --output "${f%.js}.min.js"
          done
      
      - name: Minify HTML
        run: |
          find . -maxdepth 1 -name "*.html" | while read f; do
            html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true "$f" -o "${f%.html}.min.html"
            mv "${f%.html}.min.html" "$f"
          done
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,node_modules,*.md,package*.json'
